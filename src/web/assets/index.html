<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="referrer" content="no-referrer">
<title>DmuxAI dashboard</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/session.css">
<script src="/assets/app.js" defer></script>
</head>
<body>
<header class="top">
  <h1 class="brand">DmuxAI<span class="brand-sub">dashboard</span></h1>
  <div class="theme-controls">
    <label class="theme-label" for="theme-select">Theme</label>
    <select id="theme-select" class="theme-select">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
      <option value="system">System</option>
    </select>
    <label class="theme-label" for="accent-picker">Accent</label>
    <input id="accent-picker" class="accent-picker" type="color" value="#4aa8ff" title="Accent color">
    <button id="accent-reset" type="button" class="btn accent-reset">Reset</button>
  </div>
  <nav id="status" class="status" aria-label="dashboard status">
    <span class="stat"><span class="stat-k">workspace</span><span id="workspace" class="stat-v">&ndash;</span></span>
    <span class="stat"><span class="stat-k">source</span><span id="source" class="stat-v">&ndash;</span></span>
    <span class="stat"><span class="stat-k">rev</span><span id="revision" class="stat-v">&ndash;</span></span>
    <span id="conn" class="conn conn-connecting" aria-live="polite">connecting</span>
  </nav>
</header>

<main>
  <p id="msg" class="notice" role="status" aria-live="polite" hidden></p>

  <section id="session" class="panel" aria-label="Chat" hidden></section>

  <section class="panel">
    <h2 class="panel-title">Agents</h2>
    <div id="agents" class="agents"></div>
  </section>

  <section id="todos" class="panel">
    <h2 class="panel-title">To-dos</h2>
    <p id="todo-view-only" class="hint" hidden>
      View-only: start <code>dmuxai --web</code> to run to-dos from the browser.
    </p>
    <form id="todo-form" class="todo-form">
      <div class="todo-form-row">
        <label class="todo-field todo-field-title">
          <span class="field-label">Title</span>
          <input id="todo-title" name="title" type="text" maxlength="200" required autocomplete="off">
        </label>
        <button id="todo-add" type="submit" class="btn btn-primary">Add</button>
      </div>
      <label class="todo-field">
        <span class="field-label">Body (optional)</span>
        <textarea id="todo-body" name="body" rows="2"></textarea>
      </label>
      <label class="todo-field todo-field-jira">
        <span class="field-label">Jira ticket (optional) &mdash; key or URL</span>
        <span class="jira-in">
          <input id="todo-jira" name="jira" type="text" maxlength="2048" autocomplete="off">
          <span id="todo-jira-preview" class="todo-jira-preview" role="status" aria-live="polite" hidden></span>
        </span>
      </label>
    </form>
    <div id="import-panel" class="import-panel" hidden>
      <h3 class="import-title">Import from Jira / Confluence</h3>
      <form id="import-form" class="import-form">
        <label class="todo-field import-field-server">
          <span class="field-label">Server</span>
          <select id="import-server" aria-label="MCP server to import from"></select>
        </label>
        <label class="todo-field import-field-query">
          <span class="field-label">Query (issue key, JQL, page id or CQL)</span>
          <input id="import-query" name="query" type="text" maxlength="500" autocomplete="off">
        </label>
        <button id="import-submit" type="submit" class="btn btn-primary">Import</button>
      </form>
      <p id="import-status" class="import-status" role="status" aria-live="polite" hidden></p>
    </div>
    <div id="todo-list" class="todo-list"></div>
  </section>

  <section id="graph" class="panel">
    <h2 class="panel-title">Graph</h2>
    <p id="graph-empty" class="empty">No graph run yet</p>
    <div id="graph-body" hidden>
      <div class="graph-meta">
        <span id="graph-id" class="graph-id"></span>
        <span id="graph-phase" class="graph-phase"></span>
        <span id="graph-model" class="graph-model"></span>
        <div id="graph-view-toggle" class="toggle" role="group" aria-label="Graph view mode">
          <button id="view-list" type="button" class="toggle-btn" aria-pressed="false">List</button>
          <button id="view-graph" type="button" class="toggle-btn on" aria-pressed="true">Graph</button>
        </div>
      </div>
      <p id="graph-prompt" class="graph-prompt"></p>
      <div class="graph-summary">
        <div id="graph-bar" class="bar" title="graph progress by node status"></div>
        <span id="graph-percent" class="graph-percent">0%</span>
        <span id="graph-eta" class="graph-eta" hidden></span>
        <span id="graph-counts" class="counts"></span>
      </div>
      <div class="graph-toolbar">
        <button id="graph-fit" type="button" class="btn">Fit</button>
        <span class="graph-hint">wheel to zoom &middot; drag to pan &middot; click a node for details</span>
      </div>
      <div id="graph-stage" class="graph-stage">
        <div id="graph-canvas" class="graph-canvas"></div>
        <aside id="graph-detail" class="graph-detail" hidden aria-label="Node details"></aside>
      </div>
      <div class="graph-legend">
        <span class="legend-item"><i class="legend-swatch legend-pending"></i>pending</span>
        <span class="legend-item"><i class="legend-swatch legend-running"></i>running</span>
        <span class="legend-item"><i class="legend-swatch legend-completed"></i>completed</span>
        <span class="legend-item"><i class="legend-swatch legend-failed"></i>failed</span>
      </div>
      <ol id="nodes" class="nodes"></ol>
    </div>
    <p id="gate-hint" class="gate" hidden></p>
  </section>

  <section id="memory-panel" class="panel" aria-label="Memory"></section>
</main>
<script src="/assets/memory.js" defer></script>
<script src="/assets/session.js" defer></script>
</body>
</html>
