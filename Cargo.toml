[package]
name = "dmuxai"
version = "0.1.0"
edition = "2024"
description = "One terminal. Multiple AI coding agents."
license = "MIT"

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
unicode-width = "0.2.1"
