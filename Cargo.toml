[package]
name = "dmuxai"
version = "0.2.2"
edition = "2024"
description = "One terminal. Multiple AI coding agents."
license = "MIT"

[dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "0.8.23"
unicode-width = "0.2.1"
unicode-segmentation = "1.13.3"
uuid = { version = "1.25.0", features = ["v4"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
pulldown-cmark = "0.13"
ammonia = "4"
linkify = "0.10"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "html", "regex-fancy", "parsing"] }

[features]
test-fixtures = []

[[bin]]
name = "fake-acp-agent"
path = "tests/fixtures/fake_acp_agent.rs"
test = false
required-features = ["test-fixtures"]

[dev-dependencies]
filetime = "0.2.27"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

