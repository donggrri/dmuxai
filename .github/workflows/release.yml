# GitHub Actions is currently billing-blocked for this repository, so this
# workflow no longer runs on tag push. Releases are created by hand in the
# GitHub web UI, with binaries built locally and attached to the release.
# When Actions is available again, run this workflow manually (Actions tab ->
# "Release binaries" -> "Run workflow") with the tag of an existing release to
# build the Windows and Linux assets and attach them to that release.
name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build and attach assets for (e.g. v0.2.3)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release executable
        run: cargo build --release --locked --bin dmuxai --bin dmuxai-launcher

      - name: Package release archive and checksum
        shell: pwsh
        run: |
          $archiveName = 'dmuxai-windows-x86_64.zip'
          $distributionDirectory = Join-Path $env:RUNNER_TEMP 'dmuxai-release'
          New-Item -ItemType Directory -Path $distributionDirectory | Out-Null
          Copy-Item 'target\release\dmuxai.exe' (Join-Path $distributionDirectory 'dmuxai.exe')
          Copy-Item 'target\release\dmuxai-launcher.exe' (Join-Path $distributionDirectory 'dmuxai-launcher.exe')
          Copy-Item 'packaging\windows\install.ps1' (Join-Path $distributionDirectory 'install.ps1')
          Copy-Item 'packaging\windows\uninstall.ps1' (Join-Path $distributionDirectory 'uninstall.ps1')
          Copy-Item 'packaging\windows\README-windows.txt' (Join-Path $distributionDirectory 'README-windows.txt')
          Compress-Archive -Path "$distributionDirectory\*" -DestinationPath $archiveName
          $hash = (Get-FileHash -LiteralPath $archiveName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath "$archiveName.sha256" -NoNewline -Encoding ascii

      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmuxai-windows-x86_64
          path: |
            dmuxai-windows-x86_64.zip
            dmuxai-windows-x86_64.zip.sha256
          if-no-files-found: error

  linux:
    # Static Linux x86_64 binary (musl) for WSL and native Linux users, so it
    # runs regardless of the distro's glibc. Attached to the same release as the
    # Windows zip by the publish job below.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static release executable
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --bin dmuxai --target x86_64-unknown-linux-musl

      - name: Verify the binary is static
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/dmuxai
          if ldd "$binary" 2>&1 | grep -q '=>'; then
            echo "dmuxai is dynamically linked" >&2
            ldd "$binary" >&2
            exit 1
          fi
          "$binary" --version

      - name: Package release archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          archive_name='dmuxai-linux-x86_64.tar.gz'
          staging_directory="$RUNNER_TEMP/dmuxai-linux-x86_64"
          mkdir -p "$staging_directory"
          cp target/x86_64-unknown-linux-musl/release/dmuxai "$staging_directory/dmuxai"
          cp README.md "$staging_directory/README.md"
          if [ -f CHANGELOG.md ]; then cp CHANGELOG.md "$staging_directory/CHANGELOG.md"; fi
          tar -C "$RUNNER_TEMP" -czf "$archive_name" dmuxai-linux-x86_64
          sha256sum "$archive_name" > "$archive_name.sha256"

      - name: Upload Linux release artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmuxai-linux-x86_64
          path: |
            dmuxai-linux-x86_64.tar.gz
            dmuxai-linux-x86_64.tar.gz.sha256
          if-no-files-found: error

  publish:
    # One publisher so the Windows and Linux assets land on the same release
    # without two jobs racing to create it.
    needs: [windows, linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            dist/dmuxai-windows-x86_64.zip
            dist/dmuxai-windows-x86_64.zip.sha256
            dist/dmuxai-linux-x86_64.tar.gz
            dist/dmuxai-linux-x86_64.tar.gz.sha256
