name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  spec:
    name: Spec traceability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate baseline traceability
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/check-spec.ps1 -SpecPath docs/specs/DMUXAI-BASELINE.md

  rust:
    name: Rust quality gates
    needs: spec
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check formatting
        run: cargo fmt --check
      - name: Run tests
        run: cargo test --all-targets
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
