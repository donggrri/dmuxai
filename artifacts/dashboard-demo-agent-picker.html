<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<title>DmuxAI agent picker demo</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/session.css">
<style>
body { margin: 0; font-family: system-ui, sans-serif; }
.demo-chat { max-width: 860px; margin: 1rem auto; padding: 0 1rem; }
.session-agent-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.25); display: flex; align-items: flex-end; justify-content: center; padding: 1rem; z-index: 50; }
@media (min-width: 640px) { .session-agent-overlay { align-items: center; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">DmuxAI<span class="brand-sub">dashboard</span></h1>
  <button type="button" class="btn accent-reset">Reset</button>
  <button type="button" class="btn sidebar-toggle active">Sessions</button>
  <button type="button" class="btn sidebar-toggle">Files</button>
  <button type="button" class="btn sidebar-toggle">To-dos <span class="todos-count">0</span></button>
  <button type="button" class="btn sidebar-toggle">Diff <span class="todos-count">1</span></button>
  <button type="button" class="btn sidebar-toggle">Graph</button>
  <button type="button" class="btn sidebar-toggle memory-top-btn" aria-expanded="true">Memory <span class="memory-badge memory-badge-off">Off</span></button>
</header>
<div class="demo-chat">
  <div class="session-prompt">
    <div class="session-composer-top">
      <button type="button" class="session-agent-picker" style="--agent-picker-dot:#22c55e" aria-expanded="true">Cursor · composer-2.5</button>
      <textarea class="session-input" rows="2" readonly placeholder="Message the selected agent…"></textarea>
    </div>
  </div>
</div>
<div class="session-agent-overlay">
  <div class="session-agent-popover" role="dialog" aria-label="Choose agent and model">
    <p class="session-agent-popover-title">Agent for next message</p>
    <ul class="session-agent-list">
      <li class="session-agent-item">
        <button type="button" class="session-agent-row session-agent-row-active">
          <span class="session-agent-dot" style="background:#22c55e"></span>
          <span class="session-agent-main">
            <span class="session-agent-name">Cursor</span>
            <span class="session-agent-meta">composer-2.5 · ✓ 1m22s</span>
          </span>
        </button>
        <div class="session-agent-models">
          <button type="button" class="session-model-chip on">composer-2.5</button>
          <button type="button" class="session-model-chip">gpt-5</button>
        </div>
      </li>
      <li class="session-agent-item">
        <button type="button" class="session-agent-row">
          <span class="session-agent-dot" style="background:#a855f7"></span>
          <span class="session-agent-main">
            <span class="session-agent-name">AGY</span>
            <span class="session-agent-meta">default model</span>
          </span>
        </button>
      </li>
      <li class="session-agent-item">
        <button type="button" class="session-agent-row">
          <span class="session-agent-dot" style="background:#94a3b8"></span>
          <span class="session-agent-main">
            <span class="session-agent-name">Codex</span>
            <span class="session-agent-meta">default model</span>
          </span>
        </button>
      </li>
      <li class="session-agent-item">
        <button type="button" class="session-agent-row">
          <span class="session-agent-dot" style="background:#f97316"></span>
          <span class="session-agent-main">
            <span class="session-agent-name">opencode</span>
            <span class="session-agent-meta">default model</span>
          </span>
        </button>
      </li>
      <li class="session-agent-item">
        <button type="button" class="session-agent-row">
          <span class="session-agent-dot" style="background:#3b82f6"></span>
          <span class="session-agent-main">
            <span class="session-agent-name">grok</span>
            <span class="session-agent-meta">grok-4.7</span>
          </span>
        </button>
      </li>
    </ul>
  </div>
</div>
</body>
</html>
